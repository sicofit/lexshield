[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lexshield"
dynamic = ["version"]
description = "Read-only Windows security audit for Swiss law firms"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sicofit" }]
keywords = ["security", "audit", "windows", "law firm", "switzerland", "data protection"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: System Administrators",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/sicofit/lexshield"
Issues = "https://github.com/sicofit/lexshield/issues"
Changelog = "https://github.com/sicofit/lexshield/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lexshield = "lexshield.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lexshield.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexshield = ["data/*.toml", "collect.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
