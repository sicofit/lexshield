# The Swiss legal framework LexShield's findings rest on. Not legal advice.
#
# Four parts, from general to specific:
#   duty      five duties a finding can touch; the terminal groups findings by them
#   act       the source of the norms and who it binds
#   norm      one provision, cited down to the letter; each belongs to one duty and one act
#   question  open legal questions, with the literature on each side
#
# Text in «» is the official wording, checked against the source on the date in
# "checked". Everything outside «» is a summary.

checked = 2026-11-06

# --------------------------------------------------------------------------- duties

[duty.geheimnis]
label = "Berufsgeheimnis"
text = "Was die Klientschaft anvertraut, darf niemand Unbefugtes zu sehen bekommen."

[duty.hilfspersonen]
label = "Hilfspersonen"
text = "Wer für die Kanzlei an Mandatsdaten kommt, etwa eine IT-Firma, ist sorgfältig auszuwählen und auf das Berufsgeheimnis zu verpflichten. Für Schäden, die sie dabei der Klientschaft zufügt, haftet die Kanzlei wie für eigenes Handeln."

[duty.sicherheit]
label = "Datensicherheit"
text = "Mandatsdaten sind nach dem Stand der Technik zu schützen."

[duty.sorgfalt]
label = "Sorgfalt und Haftung"
text = "Erhebliche Lücken können als unsorgfältige Berufsausübung gelten und eine Haftung aus dem Mandat begründen."

[duty.meldung]
label = "Meldepflicht"
text = "Erst bei einer Panne: Gehen Mandatsdaten verloren oder an Unbefugte, ist das zu dokumentieren und bei voraussichtlich hohem Risiko für die Betroffenen dem EDÖB zu melden."

# --------------------------------------------------------------------------- acts

[act.bgfa]
name = "BGFA"
title = "Anwaltsgesetz (SR 935.61)"
binds = "Anwältinnen und Anwälte mit Patent, die im Rahmen des Anwaltsmonopols Parteien vor Gerichtsbehörden vertreten (Art. 2 Abs. 1 BGFA). Die Berufsregeln gelten dann für die ganze Berufstätigkeit, auch für die Beratung (BGE 130 II 270 E. 3.2). Aufsicht: kantonale Aufsichtsbehörde."
url = "https://www.fedlex.admin.ch/eli/cc/2002/153/de"

[act.ssr]
name = "SSR"
title = "Schweizerische Standesregeln, in Kraft seit 1.7.2023"
binds = "Richten sich an alle in der Schweiz praktizierenden Anwältinnen und Anwälte, verbindlich sind sie für die Mitglieder des Schweizerischen Anwaltsverbands (Art. 2 SSR); die Disziplinargewalt liegt bei den kantonalen Verbänden (Art. 39 SSR). Gerichte ziehen sie zur Auslegung von Art. 12 BGFA heran, soweit sie eine landesweite Auffassung ausdrücken (BGE 130 II 270)."
url = "https://www.sav-fsa.ch/documents/672183/1748990/Schweizerische_Standesregeln_1.7.23.pdf/53bb74c0-9c9e-2ad8-d396-638aa19066c7"

[act.stgb]
name = "StGB"
title = "Strafgesetzbuch (SR 311.0)"
binds = "Rechtsanwältinnen und Rechtsanwälte samt ihren Hilfspersonen, unabhängig vom Registereintrag; auch nach Ende der Berufsausübung (Art. 321 Ziff. 1 Abs. 3 StGB)."
url = "https://www.fedlex.admin.ch/eli/cc/54/757_781_799/de"

[act.dsg]
name = "DSG"
title = "Datenschutzgesetz (SR 235.1)"
binds = "Jede Kanzlei, die Personendaten bearbeitet (Art. 2 Abs. 1 lit. a DSG), ebenso ihre Auftragsbearbeiter (Art. 8 Abs. 1 DSG)."
