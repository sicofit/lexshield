title = "Datenschutzverordnung (SR 235.11)"
binds = "Wie das DSG; die DSV legt die Mindestanforderungen an die Datensicherheit fest (Art. 8 Abs. 3 DSG)."
url = "https://www.fedlex.admin.ch/eli/cc/2022/568/de"

[act.or]
name = "OR"
title = "Obligationenrecht (SR 220)"
